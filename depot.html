<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX CAPITAL - Dépôt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased pb-28">
    <header class="apex-glass sticky top-0 z-40 px-4 py-3 border-b border-amber-500/10 flex items-center space-x-3">
        <a href="index.html" class="text-amber-500 text-sm"><i class="fa-solid fa-arrow-left"></i></a>
        <span class="font-black text-white text-sm">Dépôt</span>
    </header>

    <main class="max-w-lg mx-auto w-full px-4 py-6 space-y-6">
        <div class="apex-glass p-6 rounded-3xl space-y-4">
            <h3 class="text-sm font-bold text-white">Montant du dépôt (FCFA)</h3>
            <input type="number" id="deposit-amt" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Ex: 10000">
            <button onclick="makeDeposit()" class="w-full py-3.5 rounded-2xl gold-gradient text-slate-950 font-black text-xs shadow-lg">Valider le dépôt</button>
        </div>
    </main>

    <nav class="fixed bottom-3 left-4 right-4 apex-glass rounded-3xl p-2 px-6 flex justify-between items-center z-40 border border-amber-500/20 shadow-2xl max-w-lg mx-auto">
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-house text-base"></i><span class="text-[9px] mt-1 font-bold">Accueil</span></a>
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-layer-group text-base"></i><span class="text-[9px] mt-1 font-bold">Invest</span></a>
        <a href="equipe.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-network-wired text-base"></i><span class="text-[9px] mt-1 font-bold">Équipe</span></a>
        <a href="compte.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-user text-base"></i><span class="text-[9px] mt-1 font-bold">Compte</span></a>
    </nav>

    <script>
        function makeDeposit() {
            const amt = parseFloat(document.getElementById('deposit-amt').value);
            if (!amt || amt <= 0) return alert("Veuillez entrer un montant valide.");
            let balance = localStorage.getItem('apex_balance') ? parseFloat(localStorage.getItem('apex_balance')) : 1000.00;
            balance += amt;
            localStorage.setItem('apex_balance', balance);
            alert(`Dépôt de ${amt.toLocaleString()} FCFA validé !`);
            location.href = 'index.html';
        }
    </script>
</body>
</html>
