<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGERS - Recharge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #111827; font-family: 'Inter', sans-serif; }
        .text-brand { color: #0db14b; }
        .bg-brand { background-color: #0db14b; }
        .border-brand { border-color: #0db14b; }
        
        /* Clignotants */
        @keyframes pulseGreen { 
            0%, 100% { box-shadow: 0 0 0 rgba(13, 177, 75, 0); transform: scale(1); } 
            50% { box-shadow: 0 0 15px rgba(13, 177, 75, 0.4); transform: scale(1.02); } 
        }
        .btn-pulse { animation: pulseGreen 2s infinite; }

        @keyframes numberBlink {
            0%, 100% { color: #0db14b; }
            50% { color: #000000; }
        }
        .number-blink { animation: numberBlink 1.5s infinite; font-weight: 900; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-40 px-4 py-3 border-b border-gray-200 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 hover:bg-gray-200">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>
            <span class="font-bold text-base text-gray-800">Recharge</span>
        </div>
        <div class="flex items-center space-x-1 text-brand text-xs font-bold">
            <i class="fa-solid fa-shield-halved"></i><span>Sécurisé</span>
        </div>
    </header>

    <main class="max-w-lg mx-auto w-full px-4 py-4 space-y-5">
        
        <!-- SOLDE ACTUEL -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500 font-medium mb-1">Solde actuel</p>
                <h2 class="text-2xl font-black text-gray-900">FCFA <span id="current-balance">0</span></h2>
            </div>
            <div class="w-10 h-10 rounded-full bg-green-50 text-brand flex items-center justify-center border border-green-100">
                <i class="fa-solid fa-wallet text-lg"></i>
            </div>
        </div>

        <!-- ETAPE 1 : OPÉRATEUR -->
        <div class="space-y-2">
            <label class="text-xs font-bold text-gray-600 uppercase tracking-wider px-1">1. Choisir l'opérateur</label>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="selectOperator('Wave')" id="op-Wave" class="bg-white p-4 rounded-xl border-2 border-brand shadow-sm flex flex-col items-center justify-center space-y-2 transition btn-pulse">
                    <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-xl"><i class="fa-solid fa-water"></i></div>
                    <span class="text-sm font-bold text-gray-800">Wave</span>
                </button>
                <button onclick="selectOperator('Orange Money')" id="op-Orange Money" class="bg-white p-4 rounded-xl border-2 border-gray-100 shadow-sm flex flex-col items-center justify-center space-y-2 transition">
                    <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center text-xl"><i class="fa-solid fa-mobile-screen"></i></div>
                    <span class="text-sm font-bold text-gray-800">Orange Money</span>
                </button>
            </div>
        </div>

        <!-- ETAPE 2 : MONTANT -->
        <div class="space-y-2">
            <label class="text-xs font-bold text-gray-600 uppercase tracking-wider px-1">2. Montant (Min 2,000 FCFA)</label>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-4">
                
                <!-- Input Personnalisé -->
                <div class="flex items-center border-2 border-gray-200 rounded-xl px-4 py-2 focus-within:border-brand transition">
                    <span class="text-gray-500 font-bold text-sm">FCFA</span>
                    <input type="number" id="custom-amount" oninput="updateAmount(this.value)" class="w-full bg-transparent text-right text-xl font-black text-gray-900 focus:outline-none" value="2000" min="2000">
                </div>

                <!-- Grille de montants -->
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setAmount(2000)" class="amt-btn py-2 rounded-lg text-sm font-bold bg-brand text-white shadow-sm">2,000</button>
                    <button onclick="setAmount(5000)" class="amt-btn py-2 rounded-lg text-sm font-bold bg-gray-50 text-gray-700 border border-gray-200">5,000</button>
                    <button onclick="setAmount(10000)" class="amt-btn py-2 rounded-lg text-sm font-bold bg-gray-50 text-gray-700 border border-gray-200">10,000</button>
                    <button onclick="setAmount(20000)" class="amt-btn py-2 rounded-lg text-sm font-bold bg-gray-50 text-gray-700 border border-gray-200">20,000</button>
                    <button onclick="setAmount(50000)" class="amt-btn py-2 rounded-lg text-sm font-bold bg-gray-50 text-gray-700 border border-gray-200">50,000</button>
                    <button onclick="setAmount(100000)" class="amt-btn py-2 rounded-lg text-sm font-bold bg-gray-50 text-gray-700 border border-gray-200">100,000</button>
                </div>
            </div>
        </div>
    </main>

    <!-- BOUTON FIXE EN BAS -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 max-w-lg mx-auto flex items-center justify-between z-40">
        <div>
            <p class="text-[10px] text-gray-500 font-bold uppercase">Total à payer</p>
            <p class="text-lg font-black text-gray-900">FCFA <span id="footer-amount">2,000</span></p>
        </div>
        <button onclick="openModal()" class="px-6 py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md flex items-center space-x-2 btn-pulse">
            <i class="fa-solid fa-circle-check"></i><span>Confirmer</span>
        </button>
    </div>

    <!-- MODAL DE PAIEMENT -->
    <div id="payment-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 hidden p-4 backdrop-blur-sm">
        <div class="bg-white max-w-sm w-full rounded-2xl overflow-hidden shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-800">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <div class="bg-gray-50 p-5 border-b border-gray-100">
                <h3 class="text-base font-bold text-gray-800">Détails du transfert</h3>
                <p class="text-xs text-gray-500 mt-1">Veuillez envoyer exactement <span id="modal-amount" class="font-bold text-brand">2,000</span> FCFA via <span id="modal-op" class="font-bold">Wave</span>.</p>
            </div>

            <div class="p-5 space-y-4">
                <!-- NUMERO OFFICIEL -->
                <div class="bg-green-50 border border-green-200 rounded-xl p-3 text-center">
                    <p class="text-[10px] font-bold text-gray-500 uppercase">Numéro officiel</p>
                    <p class="text-xl font-black number-blink mt-1">75 554 57 42</p>
                    <button onclick="copyNumber()" class="mt-2 text-[10px] bg-brand text-white px-3 py-1 rounded-full font-bold">Copier le numéro</button>
                </div>

                <!-- CHAMP ID TRANSACTION -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">ID de transaction / Référence SMS</label>
                    <input type="text" id="tx-id" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-800 focus:outline-none focus:border-brand" placeholder="Ex: MP260312.1200">
                </div>

                <button onclick="submitDeposit()" id="submit-btn" class="w-full py-3.5 rounded-xl bg-gray-900 text-white font-bold text-sm shadow-md transition hover:bg-black">
                    J'ai effectué le transfert
                </button>
            </div>
        </div>
    </div>

    <!-- POPUP ALERTE -->
    <div id="custom-alert" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white max-w-xs w-full p-6 rounded-2xl text-center space-y-4 shadow-2xl">
            <div class="w-12 h-12 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <p id="alert-text" class="text-sm text-gray-700 font-medium leading-relaxed whitespace-pre-line">Message</p>
            <button onclick="closeAlert()" class="w-full py-2.5 rounded-xl bg-brand text-white font-bold text-sm">OK</button>
        </div>
    </div>

    <script>
        let currentAmount = 2000;
        let currentOperator = 'Wave';

        // Initialisation Solde
        let balance = parseFloat(localStorage.getItem('rg_recharge') || '0');
        document.getElementById('current-balance').innerText = balance.toLocaleString();

        // Changer d'Opérateur
        function selectOperator(op) {
            currentOperator = op;
            document.getElementById('modal-op').innerText = op;
            
            // Reset styles
            ['Wave', 'Orange Money'].forEach(o => {
                document.getElementById(`op-${o}`).className = 'bg-white p-4 rounded-xl border-2 border-gray-100 shadow-sm flex flex-col items-center justify-center space-y-2 transition';
            });
            // Active style
            document.getElementById(`op-${op}`).className = 'bg-white p-4 rounded-xl border-2 border-brand shadow-sm flex flex-col items-center justify-center space-y-2 transition btn-pulse';
        }

        // Changer de Montant
        function setAmount(amt) {
            currentAmount = amt;
            document.getElementById('custom-amount').value = amt;
            document.getElementById('footer-amount').innerText = amt.toLocaleString();
            document.getElementById('modal-amount').innerText = amt.toLocaleString();
            
            // Reset styles boutons
            document.querySelectorAll('.amt-btn').forEach(btn => {
                btn.className = 'amt-btn py-2 rounded-lg text-sm font-bold bg-gray-50 text-gray-700 border border-gray-200';
            });
            // Active style (on cherche le bouton par sa valeur)
            event.target.className = 'amt-btn py-2 rounded-lg text-sm font-bold bg-brand text-white shadow-sm';
        }

        function updateAmount(val) {
            currentAmount = parseFloat(val) || 0;
            document.getElementById('footer-amount').innerText = currentAmount.toLocaleString();
            document.getElementById('modal-amount').innerText = currentAmount.toLocaleString();
            
            document.querySelectorAll('.amt-btn').forEach(btn => {
                btn.className = 'amt-btn py-2 rounded-lg text-sm font-bold bg-gray-50 text-gray-700 border border-gray-200';
            });
        }

        // Gestion Modal
        function openModal() {
            if (currentAmount < 2000) {
                alert("Le montant minimum est de 2,000 FCFA.");
                return;
            }
            document.getElementById('payment-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('payment-modal').classList.add('hidden');
        }

        function copyNumber() {
            navigator.clipboard.writeText('755545742');
            alert('Numéro copié : 75 554 57 42');
        }

        // Soumettre le dépôt
        function submitDeposit() {
            const txId = document.getElementById('tx-id').value.trim();
            
            if (!txId || txId.length < 5) {
                alert("Veuillez entrer un ID de transaction valide.");
                return;
            }

            // Sauvegarde dans la liste d'attente pour l'admin
            let pending = JSON.parse(localStorage.getItem('rg_pending_deposits') || '[]');
            pending.push({
                amount: currentAmount,
                operator: currentOperator,
                txId: txId,
                date: new Date().toLocaleString('fr-FR')
            });
            localStorage.setItem('rg_pending_deposits', JSON.stringify(pending));

            closeModal();
            document.getElementById('alert-text').innerText = `✅ Demande envoyée !\n\nMontant : ${currentAmount.toLocaleString()} FCFA\n\nL'administration va valider votre compte sous peu.`;
            document.getElementById('custom-alert').classList.remove('hidden');
            
            // Redirection après 3s
            setTimeout(() => {
                location.href = 'compte.html';
            }, 3000);
        }

        function closeAlert() {
            document.getElementById('custom-alert').classList.add('hidden');
        }
    </script>
</body>
</html>
