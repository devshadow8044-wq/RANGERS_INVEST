<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Connexion · RANGERS INVEST</title><link rel="icon" href="/images/brand-mark.png"><link rel="stylesheet" href="/styles.css"><script src="/js/app.js" defer></script></head><body data-page="login" class="auth-page"><main class="auth-panel"><a class="brand" href="/index.html"><img src="/images/brand-mark.png" alt=""><span>RANGERS INVEST</span></a><h1 class="page-title">Connexion</h1><p class="subtle">Accédez à votre espace RANGERS INVEST.</p><div data-global-message hidden></div><div class="notice warning auth-unavailable" data-auth-unavailable hidden>La configuration HTTPS et de session est requise pour utiliser les comptes.</div><form class="form" data-form="login"><div class="field"><label for="country">Pays</label><select id="country" name="country" data-country required><option value="SN">Sénégal</option><option value="ML">Mali</option><option value="CI">Côte d’Ivoire</option><option value="BJ">Bénin</option></select></div><div class="field"><label for="phone">Téléphone</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required></div><div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div data-message hidden></div><button class="button" type="submit">Se connecter</button></form><p class="form-note">Pas encore de compte ? <a href="/register.html">Créer un compte</a>.</p></main></body></html>
