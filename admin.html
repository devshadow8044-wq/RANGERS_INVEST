<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b17"><title>Administration — RANGERS INVEST</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header class="top"><a class="brand" href="index.html"><span class="logo">R</span><span>RANGERS <b>INVEST</b><small>CONSOLE ADMIN</small></span></a></header><main id="admin"><section class="subpage"><span class="eyebrow">ACCÈS RESTREINT</span><h1>Console<br><em>administrateur.</em></h1><p>Connecte-toi avec les identifiants privés définis dans le fichier .env du serveur.</p><div class="card form"><label>E-mail administrateur</label><input class="field" id="email" type="email" placeholder="admin@exemple.com"><label>Mot de passe</label><input class="field" id="password" type="password" placeholder="Mot de passe"><button class="primary" id="login">Connexion sécurisée</button><p id="status"></p></div></section></main></div><script>
const API=(localStorage.getItem('ri_api')||'http://localhost:3000/api').replace(/\/$/,'');const $=s=>document.querySelector(s);async function call(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{}),...(localStorage.getItem('ri_admin_token')?{Authorization:'Bearer '+localStorage.getItem('ri_admin_token')}:{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}$('#login').onclick=async()=>{try{const d=await call('/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});localStorage.setItem('ri_admin_token',d.token);await dashboard()}catch(e){$('#status').textContent=e.message}};async function dashboard(){try{const d=await call('/admin/dashboard');$('#admin').innerHTML=`<section class="subpage"><span class="eyebrow">CONSOLE / APERÇU</span><h1>Administration</h1><div class="quick-grid"><div class="quick"><small>Membres</small><h2>${d.users}</h2></div><div class="quick"><small>Demandes en attente</small><h2>${d.pending}</h2></div></div><section class="section"><h2>Demandes</h2><div class="list">${d.requests.map(r=>`<article class="rowcard"><div><h3>${r.type==='deposit'?'Dépôt':'Retrait'} · ${r.name}</h3><p>${r.identifier} · ${r.status}${r.reference?' · '+r.reference:''}</p></div><div><div class="price">${Number(r.amount).toLocaleString('fr-FR')} FCFA</div>${r.status==='pending'?`<button class="primary small" data-decision="approve" data-id="${r.id}">Valider</button> <button class="ghost" data-decision="reject" data-id="${r.id}">Refuser</button>`:''}</div></article>`).join('')||'<p>Aucune demande.</p>'}</div></section><section class="section"><h2>Membres récents</h2><div class="list">${d.users.map(u=>`<article class="rowcard"><div><h3>${u.name}</h3><p>${u.identifier} · ${u.role}</p></div><div class="price">${Number(u.balance).toLocaleString('fr-FR')} FCFA</div></article>`).join('')}</div></section><button class="ghost" id="logout">Se déconnecter</button></section>`;$('#logout').onclick=()=>{localStorage.removeItem('ri_admin_token');location.reload()}}catch(e){$('#status').textContent=e.message;localStorage.removeItem('ri_admin_token')}}document.addEventListener('click',async e=>{const b=e.target.closest('[data-decision]');if(!b)return;if(!confirm('Confirmer cette décision ?'))return;try{await call('/admin/requests/'+b.dataset.id+'/decision',{method:'POST',body:JSON.stringify({decision:b.dataset.decision})});await dashboard()}catch(err){alert(err.message)}});
</script></body></html>
