<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGERS - Panneau d'Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #111827; font-family: 'Inter', sans-serif; }
        .text-brand { color: #0db14b; }
        .bg-brand { background-color: #0db14b; }
        
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-in { animation: popIn 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

    <!-- 1. ÉCRAN DE CONNEXION -->
    <div id="admin-login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-100 p-4">
        <div class="bg-white max-w-sm w-full p-8 rounded-3xl shadow-xl space-y-5 text-center">
            <div class="w-16 h-16 rounded-2xl bg-black mx-auto flex items-center justify-center text-white text-2xl shadow-lg">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div>
                <h3 class="text-xl font-black text-gray-800">Administration</h3>
                <p class="text-xs text-gray-500 mt-1">Entrez le code pour gérer la plateforme</p>
            </div>
            <div>
                <input type="password" id="admin-pin" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-center text-lg font-bold text-gray-800 focus:outline-none focus:border-brand" placeholder="••••••••">
            </div>
            <button onclick="loginAdmin()" class="w-full py-3.5 rounded-xl bg-brand text-white font-black text-sm shadow-md hover:bg-green-600 transition">
                Accéder au Panneau
            </button>
            <a href="index.html" class="block text-xs text-gray-400 hover:text-gray-800 underline mt-2">Retour au site</a>
        </div>
    </div>

    <!-- 2. TABLEAU DE BORD (Caché au début avec style="display: none;") -->
    <div id="admin-dashboard" style="display: none;" class="w-full">
        
        <header class="bg-white sticky top-0 z-40 px-4 py-3 border-b border-gray-200 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-black flex items-center justify-center text-white">
                    <i class="fa-solid fa-user-shield text-sm"></i>
                </div>
                <span class="font-bold text-sm text-gray-800">Admin RANGERS</span>
            </div>
            <button onclick="logoutAdmin()" class="text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg border border-red-100">Déconnexion</button>
        </header>

        <main class="max-w-2xl mx-auto w-full px-4 py-4 space-y-6">
            
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-[9px] uppercase text-gray-400 font-bold">Utilisateurs</p>
                    <p class="text-lg font-black text-gray-800" id="stat-users">1</p>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-[9px] uppercase text-gray-400 font-bold">Total Validé</p>
                    <p class="text-sm font-black text-brand truncate" id="stat-validated">0 F</p>
                </div>
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                    <p class="text-[9px] uppercase text-gray-400 font-bold">En Attente</p>
                    <p class="text-lg font-black text-orange-500" id="stat-pending">0</p>
                </div>
            </div>

            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h3 class="text-sm font-bold text-gray-800">Dépôts en attente</h3>
                    <button onclick="loadAdminData()" class="text-xs text-brand font-bold"><i class="fa-solid fa-rotate-right mr-1"></i>Actualiser</button>
                </div>
                <div id="deposits-list" class="space-y-2"></div>
            </div>

            <div class="space-y-3">
                <div class="flex justify-between items-center px-1">
                    <h3 class="text-sm font-bold text-gray-800">Retraits en attente</h3>
                </div>
                <div id="withdrawals-list" class="space-y-2"></div>
            </div>
        </main>
    </div>

    <!-- POPUP PERSONNALISÉE -->
    <div id="admin-popup" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white max-w-sm w-full p-6 rounded-3xl text-center space-y-4 shadow-2xl pop-in relative overflow-hidden">
            <div id="popup-top-bar" class="absolute top-0 left-0 w-full h-2 bg-brand"></div>
            <div id="popup-icon-bg" class="w-16 h-16 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2">
                <i id="popup-icon" class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="popup-title" class="text-lg font-black text-gray-800">Titre</h3>
            <p id="popup-message" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line"></p>
            <div id="popup-buttons" class="flex gap-2 mt-4"></div>
        </div>
    </div>

    <script>
        // ====== LOGIQUE DE CONNEXION CORRIGÉE ======
        
        // 1. Au chargement de la page, on vérifie si on est déjà connecté
        window.onload = function() {
            if(localStorage.getItem('rg_admin_logged') === 'true') {
                ouvrirDashboard();
            }
        }

        // 2. Fonction pour cacher l'écran de login et afficher le dashboard
        function ouvrirDashboard() {
            document.getElementById('admin-login-screen').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            loadAdminData(); // Charger les données
        }

        // 3. Fonction de connexion
        function loginAdmin() {
            const pinInput = document.getElementById('admin-pin').value;
            const pin = pinInput.trim(); // Enlève les espaces invisibles
            
            // Vérification du mot de passe (admin221 ou 2026)
            if(pin === 'admin221' || pin === '2026') {
                localStorage.setItem('rg_admin_logged', 'true');
                ouvrirDashboard();
            } else {
                showPopup('Erreur', 'Code incorrect. Le code est "admin221".', 'fa-triangle-exclamation', 'error');
            }
        }

        // Permettre de valider avec la touche "Entrée"
        document.getElementById('admin-pin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loginAdmin();
        });

        function logoutAdmin() {
            localStorage.removeItem('rg_admin_logged');
            location.reload();
        }

        // ====== CHARGEMENT DES DONNÉES ======
        function loadAdminData() {
            let totalValidated = parseFloat(localStorage.getItem('rg_total_validated_deposits') || '0');
            document.getElementById('stat-validated').innerText = totalValidated.toLocaleString() + ' F';

            // DÉPÔTS
            let pendingDeposits = JSON.parse(localStorage.getItem('rg_pending_deposits') || '[]');
            const depositsContainer = document.getElementById('deposits-list');
            document.getElementById('stat-pending').innerText = pendingDeposits.length;

            if(pendingDeposits.length === 0) {
                depositsContainer.innerHTML = `<div class="bg-white p-4 rounded-xl text-center text-xs text-gray-400 border border-gray-100">Aucun dépôt en attente.</div>`;
            } else {
                depositsContainer.innerHTML = '';
                pendingDeposits.forEach((dep, index) => {
                    depositsContainer.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-orange-400 flex justify-between items-center">
                            <div>
                                <span class="text-[9px] font-bold text-orange-500 bg-orange-50 px-2 py-0.5 rounded">${dep.operator}</span>
                                <p class="text-base font-black text-gray-800 mt-1">${dep.amount.toLocaleString()} FCFA</p>
                                <p class="text-[10px] text-gray-500">Réf: <span class="font-mono">${dep.txId}</span></p>
                            </div>
                            <div class="flex flex-col space-y-1">
                                <button onclick="askApproveDeposit(${index}, ${dep.amount})" class="bg-brand text-white text-[10px] font-bold px-4 py-1.5 rounded-lg shadow-sm">Valider</button>
                                <button onclick="askRejectDeposit(${index})" class="bg-red-50 text-red-500 border border-red-100 text-[10px] font-bold px-4 py-1.5 rounded-lg">Rejeter</button>
                            </div>
                        </div>
                    `;
                });
            }

            // RETRAITS
            let withdrawals = JSON.parse(localStorage.getItem('rg_withdraw_history') || '[]');
            let pendingWithdrawals = withdrawals.map((w, i) => ({...w, originalIndex: i})).filter(w => w.status === 'En attente');
            const withdrawalsContainer = document.getElementById('withdrawals-list');

            if(pendingWithdrawals.length === 0) {
                withdrawalsContainer.innerHTML = `<div class="bg-white p-4 rounded-xl text-center text-xs text-gray-400 border border-gray-100">Aucun retrait en attente.</div>`;
            } else {
                withdrawalsContainer.innerHTML = '';
                pendingWithdrawals.forEach((w) => {
                    withdrawalsContainer.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-400 flex justify-between items-center">
                            <div>
                                <span class="text-[9px] font-bold text-blue-500 bg-blue-50 px-2 py-0.5 rounded">${w.operator}</span>
                                <p class="text-base font-black text-gray-800 mt-1">${w.amount.toLocaleString()} FCFA</p>
                                <p class="text-[10px] text-gray-500">Vers: <span class="font-bold">${w.phone}</span></p>
                            </div>
                            <div class="flex flex-col space-y-1">
                                <button onclick="askApproveWithdraw(${w.originalIndex}, ${w.amount})" class="bg-brand text-white text-[10px] font-bold px-4 py-1.5 rounded-lg shadow-sm">Payer</button>
                                <button onclick="askRejectWithdraw(${w.originalIndex})" class="bg-red-50 text-red-500 border border-red-100 text-[10px] font-bold px-4 py-1.5 rounded-lg">Rejeter</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // ====== ACTIONS DÉPÔTS ======
        function askApproveDeposit(index, amount) {
            showPopup('Valider le dépôt', `Confirmez-vous avoir reçu ${amount.toLocaleString()} FCFA ?`, 'fa-check', 'confirm', () => {
                let pending = JSON.parse(localStorage.getItem('rg_pending_deposits') || '[]');
                let dep = pending[index];

                let currentRecharge = parseFloat(localStorage.getItem('rg_recharge') || '0');
                localStorage.setItem('rg_recharge', (currentRecharge + dep.amount).toFixed(2));

                let total = parseFloat(localStorage.getItem('rg_total_validated_deposits') || '0');
                localStorage.setItem('rg_total_validated_deposits', (total + dep.amount).toFixed(2));

                pending.splice(index, 1);
                localStorage.setItem('rg_pending_deposits', JSON.stringify(pending));

                loadAdminData();
                showPopup('Succès', 'Dépôt validé et client crédité !', 'fa-check-circle', 'success');
            });
        }

        function askRejectDeposit(index) {
            showPopup('Rejeter', 'Rejeter ce dépôt ?', 'fa-trash', 'confirm', () => {
                let pending = JSON.parse(localStorage.getItem('rg_pending_deposits') || '[]');
                pending.splice(index, 1);
                localStorage.setItem('rg_pending_deposits', JSON.stringify(pending));
                loadAdminData();
                showPopup('Rejeté', 'Le dépôt a été rejeté.', 'fa-times-circle', 'error');
            });
        }

        // ====== ACTIONS RETRAITS ======
        function askApproveWithdraw(originalIndex, amount) {
            showPopup('Valider le retrait', `Avez-vous payé ${amount.toLocaleString()} FCFA au client ?`, 'fa-money-bill-transfer', 'confirm', () => {
                let history = JSON.parse(localStorage.getItem('rg_withdraw_history') || '[]');
                if(history[originalIndex]) {
                    history[originalIndex].status = 'Payé';
                    localStorage.setItem('rg_withdraw_history', JSON.stringify(history));
                    loadAdminData();
                    showPopup('Succès', 'Retrait marqué comme payé !', 'fa-check-circle', 'success');
                }
            });
        }

        function askRejectWithdraw(originalIndex) {
            showPopup('Rejeter le retrait', 'Le montant sera recrédité au client. Confirmer ?', 'fa-undo', 'confirm', () => {
                let history = JSON.parse(localStorage.getItem('rg_withdraw_history') || '[]');
                if(history[originalIndex]) {
                    let w = history[originalIndex];
                    let currentRetirable = parseFloat(localStorage.getItem('rg_retirable') || '0');
                    localStorage.setItem('rg_retirable', (currentRetirable + w.amount).toFixed(2));
                    history[originalIndex].status = 'Rejeté';
                    localStorage.setItem('rg_withdraw_history', JSON.stringify(history));
                    loadAdminData();
                    showPopup('Rejeté', 'Le client a été recrédité.', 'fa-undo', 'error');
                }
            });
        }

        // ====== POPUPS ======
        function showPopup(title, message, icon, type, onConfirm) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-message').innerText = message;
            document.getElementById('popup-icon').className = `fa-solid ${icon}`;
            
            const btnContainer = document.getElementById('popup-buttons');
            btnContainer.innerHTML = '';

            if (type === 'confirm') {
                document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-orange-50 text-orange-500 mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
                document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-orange-500';
                btnContainer.innerHTML = `
                    <button onclick="closePopup()" class="w-1/2 py-3 rounded-xl bg-gray-100 text-gray-700 font-bold text-sm">Annuler</button>
                    <button id="confirm-btn" class="w-1/2 py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md">Confirmer</button>
                `;
                document.getElementById('confirm-btn').onclick = () => { closePopup(); onConfirm(); };
            } else if (type === 'error') {
                document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-red-50 text-red-500 mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
                document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-red-500';
                btnContainer.innerHTML = `<button onclick="closePopup()" class="w-full py-3 rounded-xl bg-red-500 text-white font-bold text-sm shadow-md mt-2">Fermer</button>`;
            } else {
                document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
                document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-brand';
                btnContainer.innerHTML = `<button onclick="closePopup()" class="w-full py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md mt-2">Super !</button>`;
            }

            document.getElementById('admin-popup').classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('admin-popup').classList.add('hidden');
        }
    </script>
</body>
</html>
