<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGERS - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #111827; font-family: 'Inter', sans-serif; }
        .text-brand { color: #0db14b; }
        .bg-brand { background-color: #0db14b; }
        
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes pulseGreen { 0%, 100% { box-shadow: 0 0 0 rgba(13, 177, 75, 0); } 50% { box-shadow: 0 0 10px rgba(13, 177, 75, 0.5); } }
        .btn-pulse { animation: pulseGreen 2s infinite; }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-in { animation: popIn 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <!-- BANNIÈRE -->
    <div class="w-full h-44 relative">
        <img src="https://files.catbox.moe/9kbqzl.jpg" class="w-full h-full object-cover" alt="Banner">
    </div>

    <!-- CARTE ACTIONS RAPIDES -->
    <div class="max-w-lg mx-auto w-full px-4 -mt-8 relative z-10">
        <div class="bg-white rounded-xl shadow-md p-4 flex justify-between text-center">
            <a href="depot.html" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center mb-2 btn-pulse">
                    <i class="fa-solid fa-dollar-sign text-white text-lg"></i>
                </div>
                <span class="text-xs font-medium text-gray-700">Recharge</span>
            </a>
            <a href="retrait.html" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center mb-2">
                    <i class="fa-solid fa-money-bill-transfer text-white text-lg"></i>
                </div>
                <span class="text-xs font-medium text-gray-700">Retrait</span>
            </a>
            <!-- Bouton Aide avec Popup -->
            <button onclick="showPopup('Support Client', 'Notre service client est disponible 24h/24 et 7j/7 pour vous accompagner.', 'fa-headset')" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center mb-2">
                    <i class="fa-solid fa-comments text-white text-lg"></i>
                </div>
                <span class="text-xs font-medium text-gray-700">Aide</span>
            </button>
            <!-- Bouton Pointage (Lien direct) -->
            <a href="pointage.html" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center mb-2">
                    <i class="fa-solid fa-calendar-check text-white text-lg"></i>
                </div>
                <span class="text-xs font-medium text-gray-700">Pointage</span>
            </a>
        </div>
    </div>

    <main class="max-w-lg mx-auto w-full px-4 mt-4 space-y-4">
        
        <!-- TICKER VERT -->
        <div class="bg-brand text-white text-xs py-2 px-3 rounded-lg flex items-center overflow-hidden shadow-sm">
            <i class="fa-solid fa-bell mr-2"></i>
            <div class="inline-block animate-[marquee_15s_linear_infinite] whitespace-nowrap">
                *****3175 a rechargé 2,000 • *****4371 a rechargé 2,000 • *****1234 a acheté VIP 1
            </div>
        </div>

        <!-- SOLDES -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-200 rounded-lg overflow-hidden flex flex-col items-center">
                <img src="https://files.catbox.moe/9kbqzl.jpg" class="w-full h-24 object-cover" alt="Scooter">
                <div class="p-3 text-center bg-white w-full">
                    <h3 class="text-lg font-black text-gray-900">FCFA <span id="home-balance">0</span></h3>
                    <p class="text-xs text-brand font-bold mt-1">Solde du compte</p>
                </div>
            </div>
            <div class="bg-gray-200 rounded-lg overflow-hidden flex flex-col items-center">
                <img src="https://files.catbox.moe/499w19.jpg" class="w-full h-24 object-cover" alt="Scooter">
                <div class="p-3 text-center bg-white w-full">
                    <h3 class="text-lg font-black text-gray-900">FCFA <span id="home-revenue">0</span></h3>
                    <p class="text-xs text-brand font-bold mt-1">Revenus cumulés</p>
                </div>
            </div>
        </div>

        <!-- IMPLANTATIONS -->
        <div class="text-center pt-4 pb-6">
            <h2 class="text-lg font-bold text-brand mb-1">Implantations</h2>
            <p class="text-sm text-gray-500 mb-3">Notre ville</p>
            <div class="grid grid-cols-4 gap-2">
                <img src="https://files.catbox.moe/499w19.jpg" class="w-full h-16 object-cover rounded-md shadow-sm">
                <img src="https://files.catbox.moe/78dszw.jpg" class="w-full h-16 object-cover rounded-md shadow-sm">
                <img src="https://files.catbox.moe/tn5jfj.jpg" class="w-full h-16 object-cover rounded-md shadow-sm">
                <img src="https://files.catbox.moe/9kbqzl.jpg" class="w-full h-16 object-cover rounded-md shadow-sm">
                <img src="https://files.catbox.moe/499w19.jpg" class="w-full h-16 object-cover rounded-md shadow-sm">
                <img src="https://files.catbox.moe/78dszw.jpg" class="w-full h-16 object-cover rounded-md shadow-sm">
                <img src="https://files.catbox.moe/tn5jfj.jpg" class="w-full h-16 object-cover rounded-md shadow-sm">
                <img src="https://files.catbox.moe/9kbqzl.jpg" class="w-full h-16 object-cover rounded-md shadow-sm">
            </div>
        </div>
    </main>

    <!-- NAV BAS -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-40">
        <a href="index.html" class="flex flex-col items-center text-brand"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] mt-1">Accueil</span></a>
        <a href="produits.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-bicycle text-xl"></i><span class="text-[10px] mt-1">Produit</span></a>
        <a href="equipe.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-users text-xl"></i><span class="text-[10px] mt-1">Équipe</span></a>
        <a href="compte.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-user text-xl"></i><span class="text-[10px] mt-1">Mon compte</span></a>
    </nav>

    <!-- POPUP UNIVERSELLE -->
    <div id="universal-popup" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white max-w-sm w-full p-6 rounded-3xl text-center space-y-4 shadow-2xl pop-in relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-brand"></div>
            <div class="w-16 h-16 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2">
                <i id="popup-icon" class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="popup-title" class="text-lg font-black text-gray-800">Titre</h3>
            <p id="popup-message" class="text-sm text-gray-600 leading-relaxed">Message</p>
            <button onclick="closePopup()" class="w-full py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md mt-2">Compris</button>
        </div>
    </div>

    <script>
        if(!localStorage.getItem('rg_recharge')) {
            localStorage.setItem('rg_recharge', '1000');
            localStorage.setItem('rg_revenue', '0');
        }
        document.getElementById('home-balance').innerText = parseFloat(localStorage.getItem('rg_recharge')).toLocaleString();
        document.getElementById('home-revenue').innerText = parseFloat(localStorage.getItem('rg_revenue')).toLocaleString();

        function showPopup(title, message, iconClass) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-message').innerText = message;
            document.getElementById('popup-icon').className = `fa-solid ${iconClass}`;
            document.getElementById('universal-popup').classList.remove('hidden');
        }
        function closePopup() {
            document.getElementById('universal-popup').classList.add('hidden');
        }
    </script>
</body>
</html>
