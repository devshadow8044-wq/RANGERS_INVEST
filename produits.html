<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGERS - Produits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #111827; font-family: 'Inter', sans-serif; }
        .bg-brand { background-color: #0db14b; }
        .text-brand { color: #0db14b; }
        
        @keyframes buyPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .buy-pulse { animation: buyPulse 1.5s infinite; }
        
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-in { animation: popIn 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <!-- HEADER NOIR -->
    <header class="bg-black text-white py-4 px-6 flex justify-between items-center sticky top-0 z-40 shadow-md">
        <div onclick="showMyProducts()" class="text-center w-1/2 border-r border-gray-700 cursor-pointer active:scale-95 transition-transform">
            <h2 class="text-3xl font-black" id="my-products-count">0</h2>
            <p class="text-xs text-brand font-bold mt-1 hover:underline">Mes produits ></p>
        </div>
        <div onclick="showMyRevenues()" class="text-center w-1/2 cursor-pointer active:scale-95 transition-transform">
            <h2 class="text-3xl font-black" id="my-revenue-amount">FCFA 0</h2>
            <p class="text-xs text-brand font-bold mt-1 hover:underline">Mes revenus ></p>
        </div>
    </header>

    <main class="max-w-lg mx-auto w-full py-4 space-y-4 px-2">
        <div id="products-container" class="space-y-4"></div>
    </main>

    <!-- NAV BAS -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-40">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] mt-1">Accueil</span></a>
        <a href="produits.html" class="flex flex-col items-center text-brand"><i class="fa-solid fa-car text-xl"></i><span class="text-[10px] mt-1">Produit</span></a>
        <a href="equipe.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-users text-xl"></i><span class="text-[10px] mt-1">Équipe</span></a>
        <a href="compte.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-user text-xl"></i><span class="text-[10px] mt-1">Mon compte</span></a>
    </nav>

    <!-- POPUP -->
    <div id="universal-popup" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white max-w-sm w-full p-6 rounded-3xl text-center space-y-4 shadow-2xl pop-in relative overflow-hidden">
            <div id="popup-top-bar" class="absolute top-0 left-0 w-full h-2 bg-brand"></div>
            <div id="popup-icon-bg" class="w-16 h-16 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2">
                <i id="popup-icon" class="fa-solid fa-circle-info"></i>
            </div>
            <h3 id="popup-title" class="text-lg font-black text-gray-800">Titre</h3>
            <div id="popup-message" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line text-left max-h-60 overflow-y-auto pr-2"></div>
            <div id="popup-buttons" class="flex gap-2 mt-4"></div>
        </div>
    </div>

    <script>
        // ====== LES 10 PRODUITS (Images 100% fiables) ======
        // J'utilise tes liens Catbox et des liens Unsplash très stables pour être sûr que ça marche
        const products = [
            { id: 1, name: 'VIP1 Range Rover', price: 2000, duration: 200, daily: 400, total: 80000, img: 'https://files.catbox.moe/9kbqzl.jpg' },
            { id: 2, name: 'VIP2 Range Rover', price: 8000, duration: 200, daily: 1680, total: 336000, img: 'https://files.catbox.moe/499w19.jpg' },
            { id: 3, name: 'VIP3 Range Rover', price: 20000, duration: 200, daily: 4400, total: 880000, img: 'https://files.catbox.moe/78dszw.jpg' },
            { id: 4, name: 'VIP4 Range Rover', price: 40000, duration: 200, daily: 8800, total: 1760000, img: 'https://files.catbox.moe/tn5jfj.jpg' },
            { id: 5, name: 'VIP5 Range Rover', price: 80000, duration: 200, daily: 17600, total: 3520000, img: 'https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?auto=format&fit=crop&w=500&q=80' }, // Remplacée par une image stable
            { id: 6, name: 'VIP6 Range Rover', price: 150000, duration: 200, daily: 33000, total: 6600000, img: 'https://files.catbox.moe/9kbqzl.jpg' },
            { id: 7, name: 'VIP7 Range Rover', price: 300000, duration: 200, daily: 66000, total: 13200000, img: 'https://files.catbox.moe/499w19.jpg' },
            { id: 8, name: 'VIP8 Range Rover', price: 500000, duration: 200, daily: 110000, total: 22000000, img: 'https://files.catbox.moe/78dszw.jpg' },
            { id: 9, name: 'VIP9 Range Rover', price: 1000000, duration: 200, daily: 220000, total: 44000000, img: 'https://files.catbox.moe/tn5jfj.jpg' },
            { id: 10, name: 'VIP10 Range Rover', price: 2000000, duration: 200, daily: 440000, total: 88000000, img: 'https://images.unsplash.com/photo-1542362567-b07e54358753?auto=format&fit=crop&w=500&q=80' }
        ];

        const container = document.getElementById('products-container');
        
        products.forEach(p => {
            container.innerHTML += `
                <div class="bg-[#8b929c] rounded-lg overflow-hidden shadow-md flex flex-col">
                    <div class="flex h-44">
                        <div class="w-3/5 p-4 flex flex-col justify-center bg-[#8b929c] text-white">
                            <h3 class="text-xl font-black mb-2 text-white">${p.name}</h3>
                            <div class="bg-gray-700/40 p-2.5 rounded text-[11px] space-y-1.5 w-full">
                                <div class="flex justify-between"><span>Prix :</span> <span class="font-bold">FCFA ${p.price.toLocaleString('fr-FR')}</span></div>
                                <div class="flex justify-between"><span>Durée :</span> <span class="font-bold">${p.duration} jours</span></div>
                                <div class="flex justify-between"><span>Revenu / jour :</span> <span class="font-bold">FCFA ${p.daily.toLocaleString('fr-FR')}</span></div>
                                <div class="flex justify-between"><span>Revenu total :</span> <span class="font-bold text-white">FCFA ${p.total.toLocaleString('fr-FR')}</span></div>
                            </div>
                        </div>
                        <div class="w-2/5 h-full">
                            <img src="${p.img}" class="w-full h-full object-cover" alt="Range Rover" onerror="this.src='https://files.catbox.moe/9kbqzl.jpg'">
                        </div>
                    </div>
                    <button onclick="buyProduct(${p.id}, ${p.price}, '${p.name}', ${p.total})" class="w-full bg-[#00ff00] hover:bg-green-500 text-black font-black text-sm py-3 buy-pulse transition-colors">
                        ACHETER
                    </button>
                </div>
            `;
        });

        function updateHeader() {
            const myProds = JSON.parse(localStorage.getItem('rg_my_products') || '[]');
            let rev = parseFloat(localStorage.getItem('rg_revenue') || '0');
            document.getElementById('my-products-count').innerText = myProds.length;
            document.getElementById('my-revenue-amount').innerText = `FCFA ${rev.toLocaleString('fr-FR')}`;
        }
        updateHeader();

        function buyProduct(id, price, name, totalRevenue) {
            let balance = parseFloat(localStorage.getItem('rg_recharge') || '0');
            
            if (balance < price) {
                showPopup('Solde insuffisant', `Vous avez ${balance.toLocaleString('fr-FR')} FCFA mais il faut ${price.toLocaleString('fr-FR')} FCFA pour acheter ce produit. Veuillez recharger.`, 'fa-triangle-exclamation', 'error');
                return;
            }

            showPopup('Confirmer l\'achat', `Voulez-vous vraiment acheter ${name} pour ${price.toLocaleString('fr-FR')} FCFA ?`, 'fa-car', 'confirm', () => {
                balance -= price;
                localStorage.setItem('rg_recharge', balance.toFixed(2));

                let myProds = JSON.parse(localStorage.getItem('rg_my_products') || '[]');
                myProds.push({ id, name, price, totalRevenue, date: new Date().toISOString() });
                localStorage.setItem('rg_my_products', JSON.stringify(myProds));

                let currentRevenue = parseFloat(localStorage.getItem('rg_revenue') || '0');
                localStorage.setItem('rg_revenue', (currentRevenue + totalRevenue).toFixed(2));

                updateHeader();
                showPopup('Achat réussi !', `Félicitations, vous avez acheté ${name}.\nVos revenus quotidiens de ${(totalRevenue/200).toLocaleString('fr-FR')} FCFA commencent dès demain.`, 'fa-check', 'success');
            });
        }

        function showMyProducts() {
            const myProds = JSON.parse(localStorage.getItem('rg_my_products') || '[]');
            if (myProds.length === 0) {
                showPopup('Mes Produits', 'Vous n\'avez acheté aucun produit pour le moment.', 'fa-box-open', 'info');
                return;
            }

            let html = '';
            myProds.forEach(p => {
                html += `<div class="bg-gray-50 border border-gray-100 p-2 rounded-lg mb-2">
                    <span class="font-bold text-gray-800">${p.name}</span><br>
                    <span class="text-xs text-gray-500">Acheté le ${new Date(p.date).toLocaleDateString('fr-FR')}</span>
                </div>`;
            });

            document.getElementById('popup-title').innerText = "Mes Produits";
            document.getElementById('popup-message').innerHTML = html;
            document.getElementById('popup-icon').className = 'fa-solid fa-car';
            document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
            document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-brand';
            document.getElementById('popup-buttons').innerHTML = `<button onclick="closePopup()" class="w-full py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md mt-2">Fermer</button>`;
            document.getElementById('universal-popup').classList.remove('hidden');
        }

        function showMyRevenues() {
            const myProds = JSON.parse(localStorage.getItem('rg_my_products') || '[]');
            const revTotal = parseFloat(localStorage.getItem('rg_revenue') || '0');

            if (myProds.length === 0) {
                showPopup('Mes Revenus', 'Vous n\'avez pas encore de revenus.', 'fa-chart-line', 'info');
                return;
            }

            let html = `<div class="text-center font-bold text-lg text-brand mb-3">Total : FCFA ${revTotal.toLocaleString('fr-FR')}</div>`;
            html += `<p class="text-xs text-gray-500 mb-2 text-center">Détails par produit :</p>`;
            
            myProds.forEach(p => {
                html += `<div class="bg-gray-50 border border-gray-100 p-2 rounded-lg mb-2 flex justify-between items-center">
                    <span class="text-xs font-bold text-gray-800">${p.name}</span>
                    <span class="text-xs text-brand font-bold">+ ${p.totalRevenue.toLocaleString('fr-FR')} F</span>
                </div>`;
            });

            document.getElementById('popup-title').innerText = "Mes Revenus";
            document.getElementById('popup-message').innerHTML = html;
            document.getElementById('popup-icon').className = 'fa-solid fa-chart-line';
            document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
            document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-brand';
            document.getElementById('popup-buttons').innerHTML = `<button onclick="closePopup()" class="w-full py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md mt-2">Fermer</button>`;
            document.getElementById('universal-popup').classList.remove('hidden');
        }

        function showPopup(title, message, icon, type, onConfirm) {
            document.getElementById('popup-title').innerText = title;
            if (typeof message === 'string') {
                document.getElementById('popup-message').innerText = message;
            } else {
                document.getElementById('popup-message').innerHTML = message;
            }
            document.getElementById('popup-icon').className = `fa-solid ${icon}`;
            const btnContainer = document.getElementById('popup-buttons');
            btnContainer.innerHTML = '';

            if (type === 'confirm') {
                document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-orange-50 text-orange-500 mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
                document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-orange-500';
                btnContainer.innerHTML = `
                    <button onclick="closePopup()" class="w-1/2 py-3 rounded-xl bg-gray-100 text-gray-700 font-bold text-sm transition hover:bg-gray-200">Annuler</button>
                    <button id="confirm-btn" class="w-1/2 py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md transition hover:bg-green-600">Confirmer</button>
                `;
                document.getElementById('confirm-btn').onclick = () => { closePopup(); onConfirm(); };
            } else if (type === 'error') {
                document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-red-50 text-red-500 mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
                document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-red-500';
                btnContainer.innerHTML = `<button onclick="closePopup()" class="w-full py-3 rounded-xl bg-red-500 text-white font-bold text-sm shadow-md mt-2">Fermer</button>`;
            } else if (type === 'info') {
                document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-blue-50 text-blue-500 mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
                document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-blue-500';
                btnContainer.innerHTML = `<button onclick="closePopup()" class="w-full py-3 rounded-xl bg-blue-500 text-white font-bold text-sm shadow-md mt-2">Compris</button>`;
            } else {
                document.getElementById('popup-icon-bg').className = 'w-16 h-16 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2';
                document.getElementById('popup-top-bar').className = 'absolute top-0 left-0 w-full h-2 bg-brand';
                btnContainer.innerHTML = `<button onclick="closePopup()" class="w-full py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md mt-2">Super !</button>`;
            }
            document.getElementById('universal-popup').classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('universal-popup').classList.add('hidden');
        }
    </script>
</body>
</html>
