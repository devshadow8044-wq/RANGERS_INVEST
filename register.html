<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a832">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme-reference.css">
<title>Créer un compte – RANGERS</title>
</head>
<body data-page="register">
<div class="bg" aria-hidden="true">
  <video autoplay muted loop playsinline preload="metadata"><source src="videos/inscription.mp4" type="video/mp4"></video>
</div>
<main class="wrap auth">
  <header class="hero">
    <a class="brand" href="login.html">RANGERS</a>
    <h1 style="margin-top:22px">Crée ton compte</h1>
    <p>Quelques secondes suffisent. Ton numéro de téléphone sert d'identifiant.</p>
  </header>

  <form id="form" class="card stack" novalidate>
    <nav class="seg" aria-label="Connexion ou inscription">
      <a href="login.html">Connexion</a>
      <a href="register.html" aria-current="page">Inscription</a>
    </nav>

    <div id="error" class="error" role="alert"></div>

    <div>
      <label for="country">Pays</label>
      <select id="country" class="field" required><option value="">Chargement…</option></select>
    </div>

    <div>
      <label for="phone">Numéro de téléphone</label>
      <div class="phone">
        <span id="prefix" class="prefix">+</span>
        <input id="phone" class="field" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="77 123 45 67" required>
      </div>
    </div>

    <div>
      <label for="password">Mot de passe</label>
      <div class="pw">
        <input id="password" class="field" type="password" autocomplete="new-password" required>
        <button class="toggle" type="button" aria-pressed="false">Afficher</button>
      </div>
      <p class="hint">8 caractères minimum, avec au moins une lettre et un chiffre.</p>
    </div>

    <div>
      <label for="confirm">Confirmer le mot de passe</label>
      <div class="pw">
        <input id="confirm" class="field" type="password" autocomplete="new-password" required>
        <button class="toggle" type="button" aria-pressed="false">Afficher</button>
      </div>
    </div>

    <div>
      <label for="ref">Code d'invitation <span style="color:var(--mute);font-weight:500">(facultatif)</span></label>
      <input id="ref" class="field" type="text" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="RGR8F3K2">
    </div>

    <button id="submit" class="btn" type="submit">Créer mon compte</button>
  </form>

  <p class="alt">Déjà membre ? <a href="login.html">Se connecter</a></p>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
