<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX CAPITAL - Retrait</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased pb-28">
    <header class="apex-glass sticky top-0 z-40 px-4 py-3 border-b border-amber-500/10 flex items-center space-x-3">
        <a href="index.html" class="text-amber-500 text-sm"><i class="fa-solid fa-arrow-left"></i></a>
        <span class="font-black text-white text-sm">Retirer des fonds</span>
    </header>

    <main class="max-w-lg mx-auto w-full px-4 py-6 space-y-6">
        <div class="apex-glass p-6 rounded-3xl space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Montant (FCFA)</label>
                <input type="number" id="withdraw-amt" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Ex: 5000">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Numéro Mobile Money</label>
                <input type="text" id="withdraw-acc" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Numéro de téléphone">
            </div>
            <button onclick="makeWithdraw()" class="w-full py-3.5 rounded-2xl bg-emerald-600 text-white font-black text-xs shadow-lg">Soumettre le retrait</button>
        </div>
    </main>

    <nav class="fixed bottom-3 left-4 right-4 apex-glass rounded-3xl p-2 px-6 flex justify-between items-center z-40 border border-amber-500/20 shadow-2xl max-w-lg mx-auto">
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-house text-base"></i><span class="text-[9px] mt-1 font-bold">Accueil</span></a>
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-layer-group text-base"></i><span class="text-[9px] mt-1 font-bold">Invest</span></a>
        <a href="equipe.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-network-wired text-base"></i><span class="text-[9px] mt-1 font-bold">Équipe</span></a>
        <a href="compte.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-user text-base"></i><span class="text-[9px] mt-1 font-bold">Compte</span></a>
    </nav>

    <script>
        function makeWithdraw() {
            const hasInvested = localStorage.getItem('apex_has_invested') === 'true';
            if (!hasInvested) {
                alert("Action impossible : vous devez acheter au moins un produit d'investissement avant de pouvoir effectuer un retrait (le bonus d'inscription est bloqué).");
                return;
            }
            const amt = parseFloat(document.getElementById('withdraw-amt').value);
            const acc = document.getElementById('withdraw-acc').value;
            if (!amt || !acc) return alert("Veuillez remplir tous les champs.");
            alert("Demande de retrait soumise avec succès !");
            location.href = 'index.html';
        }
    </script>
</body>
</html>
