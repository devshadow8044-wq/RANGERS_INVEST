<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGERS - Pointage Quotidien</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #111827; font-family: 'Inter', sans-serif; }
        .text-brand { color: #0db14b; }
        .bg-brand { background-color: #0db14b; }
        
        /* Animations */
        @keyframes pulseGreen { 
            0%, 100% { box-shadow: 0 0 0 rgba(13, 177, 75, 0); transform: scale(1); } 
            50% { box-shadow: 0 0 15px rgba(13, 177, 75, 0.5); transform: scale(1.03); } 
        }
        .btn-pulse { animation: pulseGreen 2s infinite; }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in { animation: popIn 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-40 px-4 py-3 border-b border-gray-200 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <a href="compte.html" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 hover:bg-gray-200">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>
            <span class="font-bold text-base text-gray-800">Pointage</span>
        </div>
    </header>

    <main class="max-w-lg mx-auto w-full px-4 py-6 space-y-6">
        
        <!-- CARTE PRINCIPALE -->
        <div class="bg-white rounded-3xl shadow-lg border border-gray-100 p-8 text-center relative overflow-hidden">
            <div class="relative z-10">
                <div class="w-20 h-20 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm">
                    <i class="fa-solid fa-calendar-check text-4xl text-brand"></i>
                </div>
                <h2 class="text-2xl font-black text-gray-900 mb-2">Pointage Quotidien</h2>
                <p class="text-sm text-gray-500 mb-6">Pointez chaque jour et recevez<br><span class="text-brand font-bold text-lg">+ 50 FCFA</span> gratuitement !</p>

                <!-- BOUTON -->
                <button id="checkin-btn" onclick="doCheckin()" class="w-full py-4 rounded-2xl bg-brand text-white font-black text-lg shadow-lg btn-pulse transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-fingerprint text-xl"></i>
                    <span>Pointer Maintenant</span>
                </button>
            </div>
        </div>

        <!-- SOLDE ACTUEL -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-black flex items-center justify-center">
                    <i class="fa-solid fa-wallet text-white"></i>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-bold uppercase">Mon Solde</p>
                    <p class="text-lg font-black text-gray-900">FCFA <span id="current-balance">0</span></p>
                </div>
            </div>
        </div>
    </main>

    <!-- 🌟 POPUP PERSONNALISÉE (Remplace l'alerte moche du navigateur) -->
    <div id="custom-popup" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white max-w-sm w-full p-6 rounded-3xl text-center space-y-4 shadow-2xl pop-in relative overflow-hidden">
            
            <!-- Effet décoratif -->
            <div class="absolute top-0 left-0 w-full h-2 bg-brand"></div>

            <!-- Icône Cadeau -->
            <div class="w-20 h-20 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-4xl border-4 border-white shadow-sm -mt-10 mb-2">
                <i class="fa-solid fa-gift"></i>
            </div>

            <h3 class="text-xl font-black text-gray-800">Félicitations !</h3>
            <p id="popup-message" class="text-sm text-gray-600 leading-relaxed">
                Vous avez gagné <b>50 FCFA</b>.<br>Revenez demain pour en gagner plus !
            </p>
            
            <button onclick="closePopup()" class="w-full py-3.5 rounded-xl bg-brand text-white font-bold text-sm shadow-md mt-2 transition hover:bg-green-600">
                Super !
            </button>
        </div>
    </div>

    <script>
        const today = new Date().toDateString(); 
        const lastCheckin = localStorage.getItem('rg_last_checkin');
        
        let balance = parseFloat(localStorage.getItem('rg_recharge') || '0');
        document.getElementById('current-balance').innerText = balance.toLocaleString('fr-FR');

        // Vérifier si déjà pointé
        function checkIfAlreadyCheckedIn() {
            const btn = document.getElementById('checkin-btn');
            if (lastCheckin === today) {
                btn.disabled = true;
                btn.className = 'w-full py-4 rounded-2xl bg-gray-200 text-gray-500 font-black text-lg shadow-sm transition flex items-center justify-center space-x-2 cursor-not-allowed';
                btn.innerHTML = '<i class="fa-solid fa-check-double text-xl"></i><span>Déjà pointé aujourd\'hui</span>';
            }
        }
        checkIfAlreadyCheckedIn();

        // Action de pointer
        function doCheckin() {
            const btn = document.getElementById('checkin-btn');
            
            // Ajouter 50 FCFA
            balance += 50;
            localStorage.setItem('rg_recharge', balance.toFixed(2));
            localStorage.setItem('rg_last_checkin', today);

            // Mettre à jour l'interface
            document.getElementById('current-balance').innerText = balance.toLocaleString('fr-FR');
            btn.disabled = true;
            btn.className = 'w-full py-4 rounded-2xl bg-gray-200 text-gray-500 font-black text-lg shadow-sm transition flex items-center justify-center space-x-2 cursor-not-allowed';
            btn.innerHTML = '<i class="fa-solid fa-check-double text-xl"></i><span>Déjà pointé aujourd\'hui</span>';

            // Mettre à jour le texte de la popup
            document.getElementById('popup-message').innerHTML = `Vous avez gagné <b>50 FCFA</b>.<br><br>Votre nouveau solde est de <b>${balance.toLocaleString('fr-FR')} FCFA</b>.`;

            // Afficher la popup personnalisée
            document.getElementById('custom-popup').classList.remove('hidden');
        }

        // Fermer la popup
        function closePopup() {
            document.getElementById('custom-popup').classList.add('hidden');
        }
    </script>
</body>
</html>
