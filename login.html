<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX CAPITAL - Connexion & Inscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased">

    <div class="max-w-md w-full space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl gold-gradient text-slate-950 mx-auto flex items-center justify-center font-black text-2xl shadow-xl">AP</div>
            <h1 class="text-2xl font-black text-white" id="main-title">Bon retour</h1>
            <p class="text-xs text-slate-400" id="sub-title">Connectez-vous pour continuer à gérer vos investissements.</p>
        </div>

        <div class="apex-glass p-6 rounded-3xl shadow-2xl border border-amber-500/20 relative">
            <div class="flex bg-slate-950 p-1 rounded-2xl mb-6 border border-slate-800">
                <button onclick="switchMode('login')" id="btn-tab-login" class="flex-1 py-2.5 rounded-xl text-xs font-bold gold-gradient text-slate-950 shadow transition">Connexion</button>
                <button onclick="switchMode('register')" id="btn-tab-register" class="flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition">Inscription</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Numéro de téléphone</label>
                    <div class="grid grid-cols-3 gap-2">
                        <select id="country-code" class="bg-slate-950 border border-slate-800 rounded-xl px-2 py-3 text-xs text-amber-500 font-bold focus:outline-none focus:border-amber-500">
                            <option value="+221">🇸🇳 +221 (Sénégal)</option>
                            <option value="+225">🇨🇮 +225 (Côte d'Ivoire)</option>
                            <option value="+223">🇲🇱 +223 (Mali)</option>
                            <option value="+226">🇧🇫 +226 (Burkina Faso)</option>
                        </select>
                        <input type="tel" id="phone-input" required class="col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Numéro">
                    </div>
                </div>

                <div id="field-pseudo" class="hidden">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Pseudo</label>
                    <input type="text" id="pseudo-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Votre pseudo">
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Mot de passe</label>
                    <input type="password" id="password-input" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="••••••••">
                </div>

                <div id="field-invite" class="hidden">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">Code d'invitation</label>
                    <input type="text" id="invite-input" value="APEX-2026" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none" readonly>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 rounded-2xl gold-gradient text-slate-950 font-black text-xs shadow-lg shadow-amber-500/20 mt-2 transition">Se connecter</button>
            </form>
        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchMode(mode) {
            currentMode = mode;
            const btnLogin = document.getElementById('btn-tab-login');
            const btnRegister = document.getElementById('btn-tab-register');
            const fieldPseudo = document.getElementById('field-pseudo');
            const fieldInvite = document.getElementById('field-invite');
            const mainTitle = document.getElementById('main-title');
            const subTitle = document.getElementById('sub-title');
            const submitBtn = document.getElementById('submit-btn');

            if (mode === 'login') {
                btnLogin.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold gold-gradient text-slate-950 shadow transition';
                btnRegister.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition';
                fieldPseudo.classList.add('hidden');
                fieldInvite.classList.add('hidden');
                mainTitle.innerText = 'Bon retour';
                subTitle.innerText = 'Connectez-vous pour continuer à gérer vos investissements.';
                submitBtn.innerText = 'Se connecter';
            } else {
                btnRegister.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold gold-gradient text-slate-950 shadow transition';
                btnLogin.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition';
                fieldPseudo.classList.remove('hidden');
                fieldInvite.classList.remove('hidden');
                mainTitle.innerText = 'Rejoignez le réseau';
                subTitle.innerText = 'Créez un compte et recevez instantanément 1,000 FCFA de bonus.';
                submitBtn.innerText = "Créer un compte";
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const country = document.getElementById('country-code').value;
            const phone = document.getElementById('phone-input').value;
            const fullPhone = country + ' ' + phone;

            if (currentMode === 'register') {
                localStorage.setItem('apex_user', fullPhone);
                localStorage.setItem('apex_balance', '1000.00');
                localStorage.setItem('apex_has_invested', 'false');
                alert("Compte créé avec succès ! +1,000 FCFA de bonus de bienvenue crédités.");
            } else {
                localStorage.setItem('apex_user', fullPhone);
            }
            location.href = 'index.html';
        }
    </script>
</body>
</html>
