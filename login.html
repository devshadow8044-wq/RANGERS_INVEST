<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGERS (RG) - Connexion & Inscription Sécurisée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        rgBg: '#030509',
                        rgCard: '#0d111a',
                        rgGold: '#f59e0b',
                        rgBorder: '#1e2638'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #030509; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .rg-glass { background: rgba(13, 17, 26, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(245, 158, 11, 0.2); }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b, #d97706); }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }
        .btn-pulse { animation: pulseGlow 2s infinite; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased py-10">

    <div class="max-w-md w-full space-y-5">
        
        <!-- BANNIÈRE DE COUVERTURE & BONUS DE BIENVENUE -->
        <div class="rg-glass rounded-3xl overflow-hidden border border-amber-500/30 shadow-2xl relative">
            <div class="h-32 w-full relative">
                <img src="https://files.catbox.moe/9kbqzl.jpg" class="w-full h-full object-cover opacity-80">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0d111a] via-slate-950/40 to-transparent"></div>
                <div class="absolute top-3 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/40 text-[10px] font-black text-amber-400 flex items-center space-x-1 shadow-lg btn-pulse">
                    <i class="fa-solid fa-gift"></i><span>Bonus de bienvenue : 1,000 FCFA</span>
                </div>
            </div>
            <div class="p-5 pt-0 relative -mt-6 text-center space-y-1">
                <h1 class="text-xl font-black text-white tracking-wider">Rejoignez le réseau</h1>
                <p class="text-xs text-slate-400">Créez un compte pour commencer à gagner chaque jour.</p>
            </div>
        </div>

        <!-- ONGLETS DE SÉLECTION (CONNEXION / INSCRIPTION) -->
        <div class="rg-glass p-1.5 rounded-2xl grid grid-cols-2 gap-1 border border-slate-800">
            <button onclick="switchTab('login')" id="tab-login" class="py-2.5 rounded-xl text-xs font-bold gold-gradient text-slate-950 transition shadow btn-pulse">Connexion</button>
            <button onclick="switchTab('register')" id="tab-register" class="py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition">Inscription</button>
        </div>

        <!-- FORMULAIRE DE CONNEXION -->
        <div id="form-login" class="rg-glass p-6 rounded-3xl space-y-4 border border-amber-500/20 shadow-xl">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">// Connexion au compte</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Numéro de téléphone</label>
                    <input type="tel" id="login-phone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Ex: 771234567">
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Mot de passe</label>
                    <input type="password" id="login-pass" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="••••••••">
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full py-3.5 rounded-2xl gold-gradient text-slate-950 font-black text-xs shadow-lg btn-pulse">Se connecter →</button>
            
            <div class="text-center pt-2">
                <button onclick="switchTab('register')" class="text-[11px] text-slate-400 hover:text-amber-400 transition">Pas encore de compte ? <span class="text-amber-500 font-bold underline">S'inscrire</span></button>
            </div>
        </div>

        <!-- FORMULAIRE D'INSCRIPTION -->
        <div id="form-register" class="rg-glass p-6 rounded-3xl space-y-4 border border-amber-500/30 shadow-xl hidden">
            <h3 class="text-sm font-bold text-white uppercase tracking-wider">// Inscription officielle</h3>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Sélectionner le pays</label>
                    <select id="reg-country" onchange="updateCountryPrefix()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-amber-500 font-bold focus:outline-none focus:border-amber-500">
                        <option value="+221">🇸🇳 Sénégal (+221)</option>
                        <option value="+225">🇨🇮 Côte d'Ivoire (+225)</option>
                        <option value="+223">🇲🇱 Mali (+223)</option>
                        <option value="+226">🇧🇫 Burkina Faso (+226)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Numéro de téléphone</label>
                    <div class="flex bg-slate-950 border border-slate-800 rounded-xl overflow-hidden">
                        <span id="reg-prefix" class="px-3 flex items-center text-amber-500 text-xs font-bold border-r border-slate-800">+221</span>
                        <input type="tel" id="reg-phone" class="w-full bg-transparent px-4 py-3 text-sm text-white focus:outline-none" placeholder="Ex: 771234567">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Nom / Pseudo</label>
                    <input type="text" id="reg-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Votre nom complet">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Mot de passe (Min 6 caractères)</label>
                    <input type="password" id="reg-pass" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="••••••••">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Code d'invitation (Optionnel)</label>
                    <input type="text" id="reg-ref" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" placeholder="Ex: RG2026">
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Code SMS de vérification</label>
                    <div class="flex space-x-2">
                        <input type="text" id="reg-sms" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-amber-400 font-bold focus:outline-none focus:border-amber-500 font-mono" placeholder="Code automatique">
                        <button id="btn-send-sms" onclick="sendSmsCode()" class="px-4 py-3 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold whitespace-nowrap hover:bg-amber-500/30 transition">Envoyer</button>
                    </div>
                </div>
            </div>

            <button onclick="handleRegister()" class="w-full py-3.5 rounded-2xl gold-gradient text-slate-950 font-black text-xs shadow-lg btn-pulse flex items-center justify-center space-x-2">
                <span>Créer un compte</span>
                <i class="fa-solid fa-chevron-right text-[10px]"></i>
            </button>

            <div class="text-center pt-2">
                <button onclick="switchTab('login')" class="text-[11px] text-slate-400 hover:text-amber-400 transition">Déjà membre ? <span class="text-amber-500 font-bold underline">Se connecter</span></button>
            </div>
        </div>

    </div>

    <!-- POPUP ALERTE -->
    <div id="custom-alert" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4">
        <div class="rg-glass max-w-xs w-full p-6 rounded-3xl text-center space-y-4 border border-amber-500/30 shadow-2xl">
            <p id="alert-text" class="text-xs text-white font-medium leading-relaxed">Message</p>
            <button onclick="closeAlert()" class="w-full py-2.5 rounded-xl gold-gradient text-slate-950 font-black text-xs">OK</button>
        </div>
    </div>

    <script>
        let generatedRandomSms = '';

        function switchTab(tab) {
            const btnLogin = document.getElementById('tab-login');
            const btnRegister = document.getElementById('tab-register');
            const formLogin = document.getElementById('form-login');
            const formRegister = document.getElementById('form-register');

            if(tab === 'login') {
                btnLogin.className = 'py-2.5 rounded-xl text-xs font-bold gold-gradient text-slate-950 transition shadow btn-pulse';
                btnRegister.className = 'py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition';
                formLogin.classList.remove('hidden');
                formRegister.classList.add('hidden');
            } else {
                btnRegister.className = 'py-2.5 rounded-xl text-xs font-bold gold-gradient text-slate-950 transition shadow btn-pulse';
                btnLogin.className = 'py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition';
                formRegister.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        function updateCountryPrefix() {
            const sel = document.getElementById('reg-country').value;
            document.getElementById('reg-prefix').innerText = sel;
        }

        function sendSmsCode() {
            const phone = document.getElementById('reg-phone').value;
            if(!phone || phone.length < 7) {
                showAlert("Veuillez d'abord entrer un numéro de téléphone valide.");
                return;
            }

            const btn = document.getElementById('btn-send-sms');
            btn.disabled = true;
            let countdown = 3;
            btn.innerText = `Envoi (${countdown}s)...`;

            let timer = setInterval(() => {
                countdown--;
                if(countdown > 0) {
                    btn.innerText = `Envoi (${countdown}s)...`;
                } else {
                    clearInterval(timer);
                    btn.innerText = 'Envoyé ✓';
                    btn.className = 'px-4 py-3 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold whitespace-nowrap';
                    
                    generatedRandomSms = Math.floor(1000 + Math.random() * 9000).toString();
                    document.getElementById('reg-sms').value = generatedRandomSms;
                    showAlert(`Code SMS (${generatedRandomSms}) généré et saisi automatiquement !`);
                }
            }, 1000);
        }

        function showAlert(msg) {
            document.getElementById('alert-text').innerText = msg;
            document.getElementById('custom-alert').classList.remove('hidden');
        }
        function closeAlert() {
            document.getElementById('custom-alert').classList.add('hidden');
        }

        function handleRegister() {
            const country = document.getElementById('reg-country').value;
            const phone = document.getElementById('reg-phone').value;
            const name = document.getElementById('reg-name').value;
            const pass = document.getElementById('reg-pass').value;
            const sms = document.getElementById('reg-sms').value;

            if(!phone || !name || !pass || !sms) {
                showAlert("Erreur : Veuillez remplir tous les champs obligatoires.");
                return;
            }

            if(sms !== generatedRandomSms) {
                showAlert("Erreur : Code SMS invalide ou non généré. Veuillez cliquer sur 'Envoyer'.");
                return;
            }

            localStorage.setItem('rg_user_name', name);
            localStorage.setItem('rg_user_phone', country + ' ' + phone);
            localStorage.setItem('rg_user_pass', pass);
            
            if(localStorage.getItem('rg_retirable') === null) {
                localStorage.setItem('rg_recharge', '0.00');
                localStorage.setItem('rg_retirable', '1000.00');
                localStorage.setItem('rg_has_invested', 'false');
            }

            localStorage.setItem('rg_logged_in', 'true');
            showAlert("Inscription réussie ! Votre bonus de 1,000 FCFA a été crédité. Redirection...");
            setTimeout(() => { location.href = 'index.html'; }, 2000);
        }

        function handleLogin() {
            const phone = document.getElementById('login-phone').value;
            const pass = document.getElementById('login-pass').value;

            const savedPhone = localStorage.getItem('rg_user_phone');
            const savedPass = localStorage.getItem('rg_user_pass');

            if(!phone || !pass) {
                showAlert("Erreur : Veuillez entrer votre numéro et votre mot de passe.");
                return;
            }

            // Si aucun compte n'est enregistré sur l'appareil, on autorise la connexion directe et crée le profil
            if(!savedPhone) {
                localStorage.setItem('rg_user_phone', phone);
                localStorage.setItem('rg_user_pass', pass);
                if(localStorage.getItem('rg_retirable') === null) {
                    localStorage.setItem('rg_recharge', '0.00');
                    localStorage.setItem('rg_retirable', '1000.00');
                    localStorage.setItem('rg_has_invested', 'false');
                }
                localStorage.setItem('rg_logged_in', 'true');
                showAlert("Connexion réussie ! Redirection...");
                setTimeout(() => { location.href = 'index.html'; }, 1500);
                return;
            }

            // Vérification stricte si un compte existe déjà
            if(savedPhone.includes(phone) && pass === savedPass) {
                localStorage.setItem('rg_logged_in', 'true');
                showAlert("Connexion réussie ! Redirection...");
                setTimeout(() => { location.href = 'index.html'; }, 1500);
            } else {
                showAlert("Erreur : Numéro de téléphone ou mot de passe incorrect.");
            }
        }
    </script>
</body>
</html>
