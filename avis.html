<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16a832">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme-reference.css">
<title>Avis – RANGERS</title>
</head>
<body data-page="reviews">
<main class="wrap">
  <div class="topbar">
    <span class="brand">RANGERS</span>
    <a class="link-btn" href="compte.html" style="text-decoration:none">← Compte</a>
  </div>
  <h1 class="page">Avis</h1>
  <section class="card stat">
    <span id="count">Chargement…</span>
    <b id="avg">–</b>
  </section>

  <h2 class="section">Ton avis</h2>
  <form id="form" class="card stack" novalidate>
    <div id="error" class="error" role="alert"></div>
    <div>
      <label>Ta note</label>
      <div class="stars" role="group" aria-label="Note sur 5">
        <button type="button" data-v="1" aria-label="1 étoile">★</button>
        <button type="button" data-v="2" aria-label="2 étoiles">★</button>
        <button type="button" data-v="3" aria-label="3 étoiles">★</button>
        <button type="button" data-v="4" aria-label="4 étoiles">★</button>
        <button type="button" data-v="5" aria-label="5 étoiles">★</button>
      </div>
    </div>
    <div>
      <label for="comment">Ton commentaire</label>
      <textarea id="comment" class="field area" maxlength="300" placeholder="Raconte ton expérience (5 à 300 caractères)"></textarea>
    </div>
    <button id="submit" class="btn" type="submit">Publier mon avis</button>
  </form>

  <h2 class="section">Avis des membres</h2>
  <section class="card" style="padding:6px 18px">
    <div id="list"></div>
    <p id="empty" class="empty" hidden>Aucun avis pour l’instant. Sois le premier !</p>
  </section>
</main>

  </ul>
