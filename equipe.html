<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX CAPITAL - Équipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased pb-28">
    <header class="apex-glass sticky top-0 z-40 px-4 py-3 border-b border-amber-500/10 flex items-center space-x-3">
        <a href="index.html" class="text-amber-500 text-sm"><i class="fa-solid fa-arrow-left"></i></a>
        <span class="font-black text-white text-sm">Mon Équipe</span>
    </header>

    <main class="max-w-lg mx-auto w-full px-4 py-6 space-y-6">
        <div class="apex-glass p-6 rounded-3xl">
            <h3 class="text-lg font-black text-white mb-2">Réseau d'affiliation</h3>
            <p class="text-xs text-slate-400 mb-4">Commissions sur 3 niveaux.</p>
            <div class="space-y-3">
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div><span class="text-white font-bold text-xs">Niveau 1</span><p class="text-[10px] text-emerald-400">25% de commission</p></div>
                    <span class="text-xs text-slate-400">0 Actifs</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div><span class="text-white font-bold text-xs">Niveau 2</span><p class="text-[10px] text-amber-500">5% de commission</p></div>
                    <span class="text-xs text-slate-400">0 Actifs</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div><span class="text-white font-bold text-xs">Niveau 3</span><p class="text-[10px] text-cyan-400">2% de commission</p></div>
                    <span class="text-xs text-slate-400">0 Actifs</span>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-3 left-4 right-4 apex-glass rounded-3xl p-2 px-6 flex justify-between items-center z-40 border border-amber-500/20 shadow-2xl max-w-lg mx-auto">
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-house text-base"></i><span class="text-[9px] mt-1 font-bold">Accueil</span></a>
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-layer-group text-base"></i><span class="text-[9px] mt-1 font-bold">Invest</span></a>
        <a href="equipe.html" class="flex flex-col items-center text-amber-500"><i class="fa-solid fa-network-wired text-base"></i><span class="text-[9px] mt-1 font-bold">Équipe</span></a>
        <a href="compte.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-user text-base"></i><span class="text-[9px] mt-1 font-bold">Compte</span></a>
    </nav>
</body>
</html>
