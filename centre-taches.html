<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGERS - Centre de tâches</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #111827; font-family: 'Inter', sans-serif; }
        .text-brand { color: #0db14b; }
        .bg-brand { background-color: #0db14b; }
        
        /* Animations */
        @keyframes pulseGreen { 
            0%, 100% { box-shadow: 0 0 0 rgba(13, 177, 75, 0); transform: scale(1); } 
            50% { box-shadow: 0 0 15px rgba(13, 177, 75, 0.5); transform: scale(1.02); } 
        }
        .btn-pulse { animation: pulseGreen 1.5s infinite; }

        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-in { animation: popIn 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <!-- HEADER -->
    <header class="bg-white sticky top-0 z-40 px-4 py-3 border-b border-gray-200 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <a href="compte.html" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-700 hover:bg-gray-200">
                <i class="fa-solid fa-arrow-left text-sm"></i>
            </a>
            <span class="font-bold text-base text-gray-800">Centre de tâches</span>
        </div>
        <div class="text-xs font-bold text-brand bg-green-50 px-3 py-1.5 rounded-lg border border-green-100">
            Solde: FCFA <span id="current-balance">0</span>
        </div>
    </header>

    <main class="max-w-lg mx-auto w-full px-4 py-5 space-y-5">
        
        <!-- BANNIÈRE D'INVITATION -->
        <div class="bg-brand rounded-2xl p-6 text-white text-center shadow-lg relative overflow-hidden">
            <div class="absolute -top-4 -right-4 w-20 h-20 bg-white/20 rounded-full blur-xl"></div>
            <div class="relative z-10">
                <i class="fa-solid fa-users-viewfinder text-4xl mb-3"></i>
                <h2 class="text-xl font-black mb-1">Défi d'Équipe</h2>
                <p class="text-xs text-green-100 mb-4">Invitez vos amis à investir et débloquez des récompenses exceptionnelles !</p>
                
                <!-- Compteur d'invités -->
                <div class="bg-white/20 rounded-xl p-3 inline-block px-6 backdrop-blur-sm">
                    <span class="text-[10px] uppercase tracking-wider block font-bold text-green-100">Investisseurs Invités</span>
                    <span class="text-3xl font-black" id="invited-count">0</span>
                </div>
            </div>
        </div>

        <!-- LISTE DES PALIERS -->
        <div class="space-y-3" id="milestones-container">
            <!-- Les cartes sont générées par Javascript -->
        </div>
    </main>

    <!-- POPUP UNIVERSELLE -->
    <div id="universal-popup" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white max-w-sm w-full p-6 rounded-3xl text-center space-y-4 shadow-2xl pop-in relative overflow-hidden">
            <div id="popup-top-bar" class="absolute top-0 left-0 w-full h-2 bg-brand"></div>
            <div id="popup-icon-bg" class="w-16 h-16 rounded-full bg-green-50 text-brand mx-auto flex items-center justify-center text-3xl border-4 border-white shadow-sm -mt-10 mb-2">
                <i id="popup-icon" class="fa-solid fa-gift"></i>
            </div>
            <h3 id="popup-title" class="text-lg font-black text-gray-800">Félicitations !</h3>
            <p id="popup-message" class="text-sm text-gray-600 leading-relaxed whitespace-pre-line"></p>
            <button onclick="closePopup()" class="w-full py-3 rounded-xl bg-brand text-white font-bold text-sm shadow-md mt-2">Super !</button>
        </div>
    </div>

    <script>
        // ====== CONFIGURATION DES PALIERS ======
        const milestones = [
            { req: 5, reward: 500 },
            { req: 10, reward: 1000 },
            { req: 20, reward: 2500 },
            { req: 50, reward: 10000 },
            { req: 100, reward: 26000 }
        ];

        // ====== ÉTAT DE L'UTILISATEUR ======
        // Récupération des vraies données (qui seront mises à jour par le backend ou l'admin)
        let invitedInvestors = parseInt(localStorage.getItem('rg_invited_investors') || '0');
        let claimedTiers = JSON.parse(localStorage.getItem('rg_claimed_tiers') || '[]');
        
        // Mise à jour du solde affiché en haut
        function updateBalanceDisplay() {
            let balance = parseFloat(localStorage.getItem('rg_recharge') || '0');
            document.getElementById('current-balance').innerText = balance.toLocaleString('fr-FR');
            document.getElementById('invited-count').innerText = invitedInvestors;
        }
        updateBalanceDisplay();

        // ====== AFFICHAGE DES PALIERS ======
        function renderMilestones() {
            const container = document.getElementById('milestones-container');
            container.innerHTML = '';

            milestones.forEach((m, index) => {
                let isClaimed = claimedTiers.includes(m.req);
                let isUnlocked = invitedInvestors >= m.req;
                
                let cardClass = "";
                let btnHTML = "";
                let iconHTML = "";

                if (isClaimed) {
                    // DÉJÀ RÉCLAMÉ (Gris avec coche)
                    cardClass = "bg-gray-50 border border-gray-200 opacity-70";
                    iconHTML = `<div class="w-10 h-10 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center"><i class="fa-solid fa-check text-lg"></i></div>`;
                    btnHTML = `<button class="bg-gray-200 text-gray-500 text-xs font-bold px-5 py-2 rounded-lg cursor-not-allowed">Déjà réclamé</button>`;
                } else if (isUnlocked) {
                    // DÉBLOQUÉ (Vert, prêt à réclamer)
                    cardClass = "bg-white border-2 border-brand shadow-md";
                    iconHTML = `<div class="w-10 h-10 rounded-full bg-green-50 text-brand flex items-center justify-center"><i class="fa-solid fa-gift text-lg"></i></div>`;
                    btnHTML = `<button onclick="claimReward(${m.req}, ${m.reward})" class="bg-brand text-white text-xs font-bold px-5 py-2 rounded-lg shadow-md btn-pulse">Réclamer</button>`;
                } else {
                    // VERROUILLÉ (Gris avec cadenas)
                    cardClass = "bg-gray-50 border border-gray-200";
                    iconHTML = `<div class="w-10 h-10 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center"><i class="fa-solid fa-lock text-lg"></i></div>`;
                    btnHTML = `<button class="bg-gray-100 text-gray-400 text-xs font-bold px-5 py-2 rounded-lg cursor-not-allowed">Bloqué</button>`;
                }

                // Barre de progression
                let percent = Math.min((invitedInvestors / m.req) * 100, 100);

                container.innerHTML += `
                    <div class="${cardClass} rounded-xl p-4 flex items-center justify-between transition-all">
                        <div class="flex items-center space-x-3">
                            ${iconHTML}
                            <div>
                                <h4 class="text-sm font-black text-gray-800">Inviter ${m.req} personnes</h4>
                                <p class="text-xs text-brand font-bold">Gain : ${m.reward.toLocaleString('fr-FR')} FCFA</p>
                                <div class="w-32 h-1.5 bg-gray-200 rounded-full mt-1.5 overflow-hidden">
                                    <div class="h-full bg-brand rounded-full" style="width: ${percent}%"></div>
                                </div>
                            </div>
                        </div>
                        <div>
                            ${btnHTML}
                        </div>
                    </div>
                `;
            });
        }
        renderMilestones();

        // ====== RÉCLAMER UNE RÉCOMPENSE ======
        function claimReward(req, reward) {
            if (invitedInvestors < req) return;
            if (claimedTiers.includes(req)) return;

            // 1. Ajouter au solde
            let currentBalance = parseFloat(localStorage.getItem('rg_recharge') || '0');
            localStorage.setItem('rg_recharge', (currentBalance + reward).toFixed(2));

            // 2. Ajouter aux récompenses réclamées
            claimedTiers.push(req);
            localStorage.setItem('rg_claimed_tiers', JSON.stringify(claimedTiers));

            // 3. Mettre à jour l'affichage
            updateBalanceDisplay();
            renderMilestones();

            // 4. Afficher la popup
            showPopup(`Félicitations !`, `Vous avez débloqué le palier de ${req} invités.\n\n+${reward.toLocaleString('fr-FR')} FCFA ajoutés à votre solde !`, 'fa-gift');
        }

        // ====== POPUP ======
        function showPopup(title, message, iconClass) {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-message').innerText = message;
            document.getElementById('popup-icon').className = `fa-solid ${iconClass}`;
            document.getElementById('universal-popup').classList.remove('hidden');
        }
        function closePopup() {
            document.getElementById('universal-popup').classList.add('hidden');
        }
    </script>
</body>
</html>
