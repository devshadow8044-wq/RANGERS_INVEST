<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RANGERS - Mon Compte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #111827; font-family: 'Inter', sans-serif; }
        .text-brand { color: #0db14b; }
        .bg-brand { background-color: #0db14b; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20">

    <main class="max-w-lg mx-auto w-full p-4 space-y-4 pt-6">
        
        <!-- SOLDES -->
        <div class="bg-white rounded-xl shadow-sm p-4 flex divide-x divide-gray-200 text-center border border-gray-100">
            <div class="w-1/2">
                <p class="text-lg font-bold text-brand mb-1">FCFA <span id="balance">1,000</span></p>
                <p class="text-xs text-gray-500">Solde du compte</p>
            </div>
            <div class="w-1/2">
                <p class="text-lg font-bold text-brand mb-1">FCFA <span id="revenue">0</span></p>
                <p class="text-xs text-gray-500">Revenus cumulés</p>
            </div>
        </div>

        <!-- 4 ACTIONS -->
        <div class="bg-white rounded-xl shadow-sm p-4 flex justify-between text-center border border-gray-100">
            <a href="depot.html" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center mb-2">
                    <i class="fa-solid fa-dollar-sign text-white text-lg"></i>
                </div>
                <span class="text-xs font-medium text-gray-700">Recharge</span>
            </a>
            <a href="retrait.html" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center mb-2">
                    <i class="fa-solid fa-money-bill-transfer text-white text-lg"></i>
                </div>
                <span class="text-xs font-medium text-gray-700">Retrait</span>
            </a>
            <button onclick="alert('Aide')" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center mb-2">
                    <i class="fa-solid fa-comments text-white text-lg"></i>
                </div>
                <span class="text-xs font-medium text-gray-700">Aide</span>
            </button>
            <button onclick="alert('Pointage')" class="flex flex-col items-center">
                <div class="w-12 h-12 rounded-full bg-black flex items-center justify-center mb-2">
                    <i class="fa-solid fa-calendar-check text-white text-lg"></i>
                </div>
                <span class="text-xs font-medium text-gray-700">Pointage</span>
            </button>
        </div>

        <!-- CENTRE DE TÂCHES -->
        <div class="relative rounded-xl overflow-hidden h-36 shadow-sm">
            <img src="https://files.catbox.moe/78dszw.jpg" class="w-full h-full object-cover" alt="Task">
            <div class="absolute inset-0 bg-black/50 p-4 flex flex-col justify-center items-end">
                <h3 class="text-white font-bold text-xl text-right leading-tight">Centre de tâches</h3>
                <p class="text-[11px] text-white text-right w-2/3 mt-1">Accomplissez des tâches et obtenez de généreux bonus</p>
                <button onclick="alert('Bientôt disponible')" class="mt-2 bg-brand text-white text-xs font-bold px-5 py-1.5 rounded-full">Aller</button>
            </div>
        </div>

        <!-- SECTION PLUS -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h4 class="text-base font-medium text-gray-800 mb-4 ml-1">Plus</h4>
            <div class="grid grid-cols-4 gap-y-6 text-center">
                <button class="flex flex-col items-center"><i class="fa-solid fa-circle-info text-2xl text-black mb-1"></i><span class="text-[10px] text-gray-700 leading-tight">À propos de<br>nous</span></button>
                <button class="flex flex-col items-center"><i class="fa-solid fa-bookmark text-2xl text-black mb-1"></i><span class="text-[10px] text-gray-700">Réglementation</span></button>
                <button class="flex flex-col items-center"><i class="fa-solid fa-file-lines text-2xl text-black mb-1"></i><span class="text-[10px] text-gray-700">Historique</span></button>
                <button onclick="alert('Service Client')" class="flex flex-col items-center"><i class="fa-solid fa-comments text-2xl text-black mb-1"></i><span class="text-[10px] text-gray-700">Service client</span></button>
                
                <button class="flex flex-col items-center"><i class="fa-solid fa-download text-2xl text-black mb-1"></i><span class="text-[10px] text-gray-700 leading-tight">Télécharger<br>l'appli</span></button>
                <button class="flex flex-col items-center"><i class="fa-regular fa-credit-card text-2xl text-black mb-1"></i><span class="text-[10px] text-gray-700">Lier une carte</span></button>
                <button onclick="alert('Changer le MDP')" class="flex flex-col items-center"><i class="fa-solid fa-pen-to-square text-2xl text-black mb-1"></i><span class="text-[10px] text-gray-700 leading-tight">Modifier le<br>MDP</span></button>
                <button class="flex flex-col items-center"><i class="fa-solid fa-gift text-2xl text-black mb-1"></i><span class="text-[10px] text-gray-700">Code cadeau</span></button>
            </div>
        </div>

        <!-- DECONNEXION -->
        <button onclick="if(confirm('Se déconnecter ?')){localStorage.clear(); location.href='login.html';}" class="w-full mt-4 py-3 rounded-xl bg-red-50 text-red-500 font-bold text-sm border border-red-100">
            Se déconnecter
        </button>
    </main>

    <!-- NAV BAS -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2 z-40">
        <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] mt-1">Accueil</span></a>
        <a href="produits.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-bicycle text-xl"></i><span class="text-[10px] mt-1">Produit</span></a>
        <a href="equipe.html" class="flex flex-col items-center text-gray-400 hover:text-gray-800"><i class="fa-solid fa-users text-xl"></i><span class="text-[10px] mt-1">Équipe</span></a>
        <a href="compte.html" class="flex flex-col items-center text-brand"><i class="fa-solid fa-user text-xl"></i><span class="text-[10px] mt-1">Mon compte</span></a>
    </nav>

    <script>
        document.getElementById('balance').innerText = parseFloat(localStorage.getItem('rg_recharge') || 0).toLocaleString();
        document.getElementById('revenue').innerText = parseFloat(localStorage.getItem('rg_revenue') || 0).toLocaleString();
    </script>
</body>
</html>
