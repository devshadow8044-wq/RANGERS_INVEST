<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX CAPITAL - Compte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col antialiased pb-28">
    <header class="apex-glass sticky top-0 z-40 px-4 py-3 border-b border-amber-500/10 flex items-center space-x-3">
        <a href="index.html" class="text-amber-500 text-sm"><i class="fa-solid fa-arrow-left"></i></a>
        <span class="font-black text-white text-sm">Mon Compte</span>
    </header>

    <main class="max-w-lg mx-auto w-full px-4 py-6 space-y-6">
        <div class="apex-glass p-6 rounded-3xl text-center space-y-3">
            <div class="w-16 h-16 rounded-full gold-gradient text-slate-950 mx-auto flex items-center justify-center text-2xl font-black shadow-lg">AP</div>
            <h3 class="font-bold text-white text-base" id="user-phone">Membre</h3>
            <p class="text-xs text-slate-400">Statut : Actif</p>
            <button onclick="logout()" class="w-full py-2.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 font-bold text-xs">Se déconnecter</button>
        </div>
    </main>

    <nav class="fixed bottom-3 left-4 right-4 apex-glass rounded-3xl p-2 px-6 flex justify-between items-center z-40 border border-amber-500/20 shadow-2xl max-w-lg mx-auto">
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-house text-base"></i><span class="text-[9px] mt-1 font-bold">Accueil</span></a>
        <a href="index.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-layer-group text-base"></i><span class="text-[9px] mt-1 font-bold">Invest</span></a>
        <a href="equipe.html" class="flex flex-col items-center text-slate-400 hover:text-white"><i class="fa-solid fa-network-wired text-base"></i><span class="text-[9px] mt-1 font-bold">Équipe</span></a>
        <a href="compte.html" class="flex flex-col items-center text-amber-500"><i class="fa-solid fa-user text-base"></i><span class="text-[9px] mt-1 font-bold">Compte</span></a>
    </nav>

    <script>
        const phone = localStorage.getItem('apex_user') || 'Utilisateur';
        document.getElementById('user-phone').innerText = phone;

        function logout() {
            localStorage.clear();
            location.href = 'login.html';
        }
    </script>
</body>
</html>
