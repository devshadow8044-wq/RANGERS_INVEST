<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Compte – RANGERS</title>
</head>
<body data-page="account">
<div class="bg" aria-hidden="true">
  <video autoplay muted loop playsinline preload="metadata"><source src="videos/interieur.mp4" type="video/mp4"></video>
</div>
<main class="wrap">
  <div class="topbar">
    <span class="brand">RANGERS</span>
  </div>
  <h1 class="page">Mon compte</h1>

  <section class="card">
    <dl class="rows" style="margin:0">
      <div><dt>Numéro</dt><dd id="phone">…</dd></div>
      <div><dt>Membre depuis</dt><dd id="since">…</dd></div>
    </dl>
  </section>

  <h2 class="section">Menu</h2>
  <section class="card menu" aria-label="Menu du compte">
    <a class="row" href="historique.html"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Historique<span class="chev">›</span></a>
    <a class="row" id="support" href="#" data-soon="Service client : bientôt disponible"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-1a8 8 0 0116 0v1"/><rect x="3" y="13" width="4" height="6" rx="1.5"/><rect x="17" y="13" width="4" height="6" rx="1.5"/><path d="M20 19a4 4 0 01-4 3h-2"/></svg></span>Service client<span class="chev">›</span></a>
    <a class="row" href="apropos.html"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>À propos<span class="chev">›</span></a>
    <a class="row" href="avis.html"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></span>Avis<span class="chev">›</span></a>
  </section>

  <h2 class="section">Sécurité</h2>
  <form id="form" class="card stack" novalidate>
    <div id="error" class="error" role="alert"></div>
    <div>
      <label for="current">Mot de passe actuel</label>
      <div class="pw">
        <input id="current" class="field" type="password" autocomplete="current-password" required>
        <button class="toggle" type="button" aria-pressed="false">Afficher</button>
      </div>
    </div>
    <div>
      <label for="password">Nouveau mot de passe</label>
      <div class="pw">
        <input id="password" class="field" type="password" autocomplete="new-password" required>
        <button class="toggle" type="button" aria-pressed="false">Afficher</button>
      </div>
      <p class="hint">8 caractères minimum, avec au moins une lettre et un chiffre.</p>
    </div>
    <div>
      <label for="confirm">Confirmer le nouveau mot de passe</label>
      <div class="pw">
        <input id="confirm" class="field" type="password" autocomplete="new-password" required>
        <button class="toggle" type="button" aria-pressed="false">Afficher</button>
      </div>
    </div>
    <button id="submit" class="btn" type="submit">Changer le mot de passe</button>
  </form>

  <button id="logout" class="btn btn-ghost" type="button" style="margin-top:18px">Se déconnecter</button>
</main>

<nav class="tabbar" aria-label="Navigation principale">

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Accueil</a></li>

      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M3 13h18"/></svg>Activités</a></li>
    <li><a href="equipe.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0"/><path d="M16 4.6a3.5 3.5 0 010 6.8"/><path d="M18 14.2A6.5 6.5 0 0121.5 20"/></svg>Équipe</a></li>
    <li><a href="compte.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Compte</a></li>
  </ul>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
